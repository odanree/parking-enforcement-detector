services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - parking-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  detector:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/app/config:ro
      - ./snapshots:/app/snapshots
      - ./logs:/app/logs
      # Persist the vector store and dataset images across container rebuilds.
      # Without these, the DB lives in the ephemeral writable layer and is lost
      # on every `docker compose up --build` / recreate.
      - ./data:/app/data
      - ./dataset:/app/dataset
    networks:
      - parking-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_data:

networks:
  parking-net:
    driver: bridge
