services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      # Unload the model 30s after the last call so its ~6GB RAM is freed
      # between detection events (VLM fires only when a person is near a vehicle).
      - OLLAMA_KEEP_ALIVE=30s
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - parking-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  detector:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      # Set TZ in .env for local time in logs / off-hours gate. Defaults to UTC
      # so the tracked file doesn't leak the operator's geographic region.
      - TZ=${TZ:-UTC}
    volumes:
      - ./config:/app/config:ro
      - ./snapshots:/app/snapshots
      - ./logs:/app/logs
      # Persist the vector store and dataset images across container rebuilds.
      # Without these, the DB lives in the ephemeral writable layer and is lost
      # on every `docker compose up --build` / recreate.
      - ./data:/app/data
      - ./dataset:/app/dataset
      # ChromaDB's Rust backend requires POSIX file locking (WAL mode) which
      # is incompatible with Windows NTFS mounts via WSL2/9P. Named volume
      # stores the DB on the Linux ext4 filesystem inside the WSL2 VM,
      # overriding the ./data bind mount for just this subdirectory.
      - chroma-data:/app/data/vectors
    networks:
      - parking-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_data:
  chroma-data:

networks:
  parking-net:
    driver: bridge
