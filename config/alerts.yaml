# ── Alert channels ────────────────────────────────────────────────────────────
alerts:
  # Minimum VLM confidence to fire an alert (0.0–1.0)
  min_confidence: 0.70

  # Seconds before the same event type can fire again
  cooldown_seconds:
    chalking: 300   # 5 min — one alert per enforcement visit
    sweeper: 600    # 10 min — one alert per sweep pass
    rodent: 120     # 2 min — rodents pass through fast; still avoid flooding

  home_assistant:
    enabled: false
    # Separate webhook IDs so HA automations can distinguish event type
    chalking_webhook_id: parking_chalking_detected
    sweeper_webhook_id: parking_sweeper_detected
    rodent_webhook_id: rodent_detected

  generic_webhook:
    enabled: false
    url: ""
    # Extra headers (e.g. Authorization: Bearer <token>)
    headers: {}

  # Save annotated JPEG snapshot alongside every alert
  save_snapshot: true
  snapshot_dir: snapshots
