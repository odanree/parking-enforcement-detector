# ── Object Detection ─────────────────────────────────────────────────────────
detector:
  model: yolov8n.pt
  threshold: 0.65          # 65% — prevents ghost alerts from shadows / cats
  input_width: 1280
  input_height: 720
  tracked_classes:         # COCO class names
    - person
    - truck
    - motorcycle
  # Fraction of total frame area (width * height)
  min_area_fraction: 0.02  # filters birds / tiny objects
  max_area_fraction: 0.50  # filters vehicle parked right in front of lens

# ── Stationary masking ────────────────────────────────────────────────────────
# Tracks that haven't moved more than `pixel_threshold` px in `frames` frames
# are suppressed so your own parked car doesn't fire alerts every 5 s.
stationary_mask:
  enabled: true
  pixel_threshold: 15
  frames: 30

# ── Zones ─────────────────────────────────────────────────────────────────────
# Polygon vertices in [x, y] pixel coordinates at 1280x720.
# Use scripts/calibrate_zones.py to draw these interactively.
zones:
  street_zone:
    # Covers street-side tires of cars parked along the curb.
    # Adjust to your camera's perspective.
    polygon:
      - [200, 400]
      - [1080, 400]
      - [1080, 720]
      - [200, 720]

# ── Chalking behavior signature ──────────────────────────────────────────────
chalking:
  # Person's bounding-box height must decrease by this fraction to trigger.
  height_decrease_threshold: 0.30   # 30 %
  history_frames: 15                # sliding window used to compute baseline
  # Cooldown before the same track_id can fire again (seconds).
  cooldown_seconds: 60

# ── Sweeper behavior signature ────────────────────────────────────────────────
sweeper:
  # Pixel-per-frame velocity range translated to real-world 5–10 mph.
  # Calibrate with scripts/calibrate_velocity.py once camera is mounted.
  min_velocity_px_per_frame: 3.0
  max_velocity_px_per_frame: 20.0
  # Number of consecutive frames the velocity must be in range before trigger.
  sustained_frames: 10
