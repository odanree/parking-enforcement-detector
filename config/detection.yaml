  input_width: 1280
  max_area_fraction: 0.5
  min_area_fraction: 0.001
  model: yolov8n.pt
  threshold: 0.65
  tracked_classes:
  - person
  - truck
  - motorcycle
motion_detector:
  edge_margin: 50
  history: 500
  max_area: 12000
  min_area: 600
  seam_margin: 0
  seam_x: 0
  var_threshold: 25
pe_vehicle:
  cooldown_seconds: 30
  entry_frames: 3
  entry_min_px: 5.0
  stop_px_per_frame: 3.0
  sustained_frames: 20
stationary_mask:
  enabled: true
  frames: 30
  pixel_threshold: 15
sweeper:
  max_velocity_px_per_frame: 20.0
  min_velocity_px_per_frame: 3.0
  sustained_frames: 10
zones:
  street_zone:
    polygon:
    - - 0
      - 0
    - - 1280
      - 0
    - - 1280
      - 720
    - - 0
      - 720
